name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests
        run: node test/unit.mjs
      - name: Package
        run: bash package.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: duxiumeta-xpi
          path: dist/duxiumeta.xpi
