name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build XPI
        run: bash package.sh

      - name: Generate update.json
        run: node scripts/make-update.mjs

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/duxiumeta.xpi
            dist/update.json
          generate_release_notes: true
